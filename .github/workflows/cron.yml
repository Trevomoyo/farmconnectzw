name: Daily Market Prices

on:
  schedule:
    - cron: '0 4 * * *'  # 4:00 AM UTC = 6:00 AM Zimbabwe time
  workflow_dispatch:       # allows manual trigger from GitHub Actions tab

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger market price refresh
        run: |
          curl -X POST "${{ secrets.RENDER_URL }}/api/cron/prices" \
               -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
               -f \
               --retry 3 \
               --retry-delay 10
