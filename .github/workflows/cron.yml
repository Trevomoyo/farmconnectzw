name: Daily Market Prices

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger market price refresh
        run: |
          curl -X POST "https://farmconnectzw.onrender.com/api/cron/prices" \
               -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
               -f \
               --retry 3 \
               --retry-delay 10
